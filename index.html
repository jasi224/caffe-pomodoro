<script id="iphone-reliability">
(() => {
  const KEY = 'caffePomodoroReliableTimer';

  // Ask for notification permission only after an explicit user action.
  window.enablePomodoroNotifications = async function () {
    if (!('Notification' in window)) return false;
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') return false;
    try {
      return (await Notification.requestPermission()) === 'granted';
    } catch (_) { return false; }
  };

  // Helpers for a timestamp-based timer. Existing UI can call these without
  // relying on background setInterval execution.
  window.CaffeReliableTimer = {
    start(seconds, mode='focus') {
      const state = { mode, endAt: Date.now() + seconds * 1000, duration: seconds };
      localStorage.setItem(KEY, JSON.stringify(state));
      return state;
    },
    clear() {
      localStorage.removeItem(KEY);
    },
    get() {
      try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
      catch (_) { return null; }
    },
    remaining() {
      const s = this.get();
      return s ? Math.max(0, Math.ceil((s.endAt - Date.now()) / 1000)) : null;
    }
  };

  // iOS may suspend the PWA. On return, announce expiration and let the page
  // recalculate from the stored absolute end time.
  async function reconcileTimer() {
    const state = window.CaffeReliableTimer.get();
    if (!state) return;
    const remaining = window.CaffeReliableTimer.remaining();
    window.dispatchEvent(new CustomEvent('caffe-timer-reconcile', {
      detail: { ...state, remaining }
    }));
    if (remaining === 0 && !state.notified) {
      state.notified = true;
      localStorage.setItem(KEY, JSON.stringify(state));
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          const reg = await navigator.serviceWorker?.ready;
          if (reg) {
            await reg.showNotification(
              state.mode === 'focus' ? '🍅 Pomodoro raccolto!' : '☕ Pause beendet',
              { body: state.mode === 'focus' ? 'Bravo – gönn deinen Augen und deinem Geist eine Pause' : 'Bereit für die nächste Fokusphase.',
                icon: './icons/icon-192.png', badge: './icons/icon-192.png',
                tag: 'caffe-pomodoro-timer', renotify: true }
            );
          }
        } catch (_) {}
      }
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') reconcileTimer();
  });
  window.addEventListener('pageshow', reconcileTimer);
  window.addEventListener('focus', reconcileTimer);
  reconcileTimer();
})();
</script>


<script id="tiktok-v4">
(() => {
  let ctx, interval = null, enabled = true, flip = false;

  function ensureAudio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
  }
  function click(freq) {
    if (!enabled || !ctx || ctx.state !== 'running') return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.035, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.025);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.03);
  }
  function startTicking() {
    ensureAudio();
    if (interval) return;
    click(1150);
    interval = setInterval(() => { flip=!flip; click(flip ? 1150 : 900); }, 1000);
  }
  function stopTicking() {
    if (interval) clearInterval(interval);
    interval = null;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('button,[role="button"]');
    if (!el) return;
    const t = (el.textContent || '').trim().toLowerCase();
    if (/start|fortsetzen|weiter/.test(t)) startTicking();
    if (/pause|stop|zurücksetzen|reset/.test(t)) stopTicking();
  }, {passive:true});

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopTicking();
  });

  window.CaffeTickTock = { start:startTicking, stop:stopTicking, setEnabled:v=>{enabled=!!v;if(!enabled)stopTicking();} };
})();
</script>


<div id="ios-notification-optin" style="max-width:520px;margin:12px auto;padding:0 16px;">
  <button type="button" id="enable-notifications-v4"
    style="width:100%;padding:12px 16px;border:1px solid #1C120C;border-radius:12px;background:#FAF5EE;color:#1C120C;font-weight:600;">
    Mitteilungen aktivieren
  </button>
</div>
<script>
document.getElementById('enable-notifications-v4')?.addEventListener('click', async () => {
  const ok = await window.enablePomodoroNotifications?.();
  if (ok) document.getElementById('ios-notification-optin')?.remove();
});
if ('Notification' in window && Notification.permission === 'granted') {
  document.getElementById('ios-notification-optin')?.remove();
}
</script>
